<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>隐写加密通讯工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 隐写加密通讯工具</h1>
            <p class="subtitle">将文本藏进图片像素 · 只有密钥持有者才能读取</p>
        </header>

        <!-- Tab 切换 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="encode">📝 编码（文本→图片）</button>
            <button class="tab-btn" data-tab="decode">🔓 解码（图片→文本）</button>
        </div>

        <!-- ========== 编码面板 ========== -->
        <section class="panel active" id="panel-encode">
            <div class="form-group">
                <label for="encode-text">📄 要隐藏的文本内容</label>
                <textarea id="encode-text" placeholder="输入你想隐藏的秘密信息..." rows="5"></textarea>
                <div class="char-count"><span id="char-count">0</span> 字符</div>
            </div>

            <div class="form-group">
                <label>🔑 密钥模式</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="key-mode" value="default" checked>
                        <span>默认密钥（公开，不加密）</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="key-mode" value="random">
                        <span>随机密钥（AES-256 加密）</span>
                    </label>
                </div>
            </div>

            <div class="form-group" id="random-key-display" style="display: none;">
                <label>🎲 随机密钥</label>
                <div class="key-row">
                    <input type="text" id="random-key-value" placeholder="点击「生成密钥」自动创建" readonly>
                    <button class="btn btn-secondary" id="btn-generate-key">⚡ 生成密钥</button>
                    <button class="btn btn-secondary" id="btn-copy-key">📋 复制</button>
                </div>
                <p class="hint">⚠️ 请妥善保存此密钥，解密时必须使用相同的密钥</p>
            </div>

            <div class="form-group">
                <label>🖼️ 载体图（可选）</label>
                <div class="upload-area" id="carrier-upload">
                    <input type="file" id="carrier-file" accept="image/*" hidden>
                    <div class="upload-placeholder">
                        <span class="upload-icon">📎</span>
                        <span>点击或拖拽图片到此</span>
                    </div>
                    <div class="upload-preview" id="carrier-preview" style="display: none;">
                        <img id="carrier-thumb" src="" alt="载体图预览">
                        <button class="btn-remove" id="btn-remove-carrier">✕</button>
                    </div>
                </div>
                <p class="hint">不上传则自动生成正方形 PNG；上传后数据藏入该图，输出原格式</p>
            </div>

            <button class="btn btn-primary btn-block" id="btn-encode">
                🚀 生成隐写图片
            </button>

            <!-- 结果区域 -->
            <div class="result-area" id="encode-result" style="display: none;">
                <h3>✅ 生成成功</h3>

                <div class="preview-box">
                    <img id="result-preview" src="" alt="生成的隐写图片">
                </div>
                <p class="preview-hint">↑ 图片已放大显示，实际尺寸可能很小</p>

                <div class="result-info" id="result-info"></div>

                <div class="action-row">
                    <a class="btn btn-primary" id="btn-download" download>💾 保存到相册</a>
                </div>
            </div>

            <!-- 错误区域 -->
            <div class="error-area" id="encode-error" style="display: none;"></div>
        </section>

        <!-- ========== 解码面板 ========== -->
        <section class="panel" id="panel-decode">
            <div class="form-group">
                <label>🖼️ 上传隐写图片</label>
                <div class="upload-area" id="decode-upload">
                    <input type="file" id="decode-file" accept="image/*" hidden>
                    <div class="upload-placeholder">
                        <span class="upload-icon">📎</span>
                        <span>点击或拖拽隐写图片到此</span>
                    </div>
                    <div class="upload-preview" id="decode-preview" style="display: none;">
                        <img id="decode-thumb" src="" alt="上传的图片">
                        <button class="btn-remove" id="btn-remove-decode">✕</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="decode-key">🔑 密钥（随机密钥模式时必填）</label>
                <input type="text" id="decode-key" placeholder="如果是默认密钥加密的图片，留空即可">
            </div>

            <button class="btn btn-primary btn-block" id="btn-decode">
                🔍 开始解析
            </button>

            <!-- 结果区域 -->
            <div class="result-area" id="decode-result" style="display: none;">
                <h3>✅ 解析成功</h3>
                <div class="text-output-box">
                    <textarea id="decoded-text" rows="8" readonly></textarea>
                </div>
                <div class="action-row">
                    <button class="btn btn-secondary" id="btn-copy-text">📋 复制文本</button>
                </div>
            </div>

            <!-- 错误区域 -->
            <div class="error-area" id="decode-error" style="display: none;"></div>
        </section>

        <footer>
            <p>🔒 默认密钥 <code>WelcomeToUse888!</code> 为公开兼容模式（不加密）</p>
            <p>🛡️ 随机密钥使用 AES-256-GCM 加密，只有密钥持有者才能解密</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
